name: Extract All M3U Combined (Android Box Player)

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */2 * * *"   # 每2小时第5分钟执行

jobs:
  fetch-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install cloudscraper

      - name: Fetch MyTV + Gather + Sport and Merge
        run: |
          python3 - <<'EOF'
          import cloudscraper

          # -----------------------------
          # 1️⃣ 公用抓取函数
          # -----------------------------
          def fetch(url):
              scraper = cloudscraper.create_scraper(
                  browser={'browser': 'chrome', 'platform': 'android', 'mobile': True}
              )
              headers = {
                  "User-Agent": "AppleCoreMedia/1.0.0.7B367 (iPad; U; CPU OS 4_3_3 like Mac OS X)",
                  "Accept": "*/*",
                  "Icy-MetaData": "1"
              }
              print(f"\n📡 Fetching: {url}")
              try:
                  resp = scraper.get(url, headers=headers, timeout=25)
                  if resp.status_code == 200 and resp.text.strip().startswith("#EXTM3U"):
                      return resp.text
              except Exception as e:
                  print(f"❌ Error fetching {url}: {e}")
              return None

          # -----------------------------
          # 2️⃣ 核心清洗函数 (统一过滤逻辑)
          # -----------------------------
          def clean_m3u(raw_text):
              if not raw_text:
                  return ""
              lines = raw_text.splitlines()
              filtered = []
              skip_next = False
              
              for line in lines:
                  # 过滤包含无效关键词的行
                  if any(x in line for x in ["302.mp4", "301.mp4", "温馨提示.png"]):
                      continue
                      
                  # 过滤“免费订阅”及其对应的下一行 URL
                  if 'tvg-id="免費訂閲"' in line:
                      skip_next = True
                      continue
                  if skip_next:
                      skip_next = False
                      continue
                      
                  filtered.append(line)
              return "\n".join(filtered)

          # -----------------------------
          # 3️⃣ 执行抓取与清洗
          # -----------------------------
          
          # 处理 MyTV
          mytv_raw = fetch("https://iptv.yang-1989.eu.org/m3u/myTV.m3u")
          if mytv_raw:
              mytv_clean = clean_m3u(mytv_raw)
              with open("MyTV.m3u", "w", encoding="utf-8") as f:
                  f.write(mytv_clean)
              print("✔ MyTV.m3u cleaned and saved")

          # 处理 Gather
          gather_raw = fetch("https://iptv.yang-1989.eu.org/m3u/Gather.m3u")
          if gather_raw:
              gather_clean = clean_m3u(gather_raw)
              with open("Gather.m3u", "w", encoding="utf-8") as f:
                  f.write(gather_clean)
              print("✔ Gather.m3u cleaned and saved")

          # 处理 Sport
          sport_raw = fetch("https://iptv.yang-1989.eu.org/m3u/Sport.m3u")
          if sport_raw:
              sport_clean = clean_m3u(sport_raw)
              with open("Sport.m3u", "w", encoding="utf-8") as f:
                  f.write(sport_clean)
              print("✔ Sport.m3u cleaned and saved")

          # -----------------------------
          # 4️⃣ 规范化合并生成 yang.m3u
          # -----------------------------
          print("\n🔗 Merging all cleaned files into yang.m3u ...")
          with open("yang.m3u", "w", encoding="utf-8") as out:
              out.write("#EXTM3U\n")
              for name in ["MyTV.m3u", "Gather.m3u", "Sport.m3u"]:
                  try:
                      with open(name, "r", encoding="utf-8") as f:
                          content = f.read().strip()
                          if content.startswith("#EXTM3U"):
                              # 移除重复的头部标签
                              content = content.replace("#EXTM3U", "", 1).strip()
                          if content:
                              out.write("\n" + content + "\n")
                  except:
                      print(f"⚠ {name} 不存在，跳过")
          print("🎉 All tasks completed!")
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MyTV.m3u Gather.m3u Sport.m3u yang.m3u || true
          git commit -m "Update All M3U (Filtered & Merged)" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
